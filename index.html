<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Register</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <div>
          <form method="get">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" required />
            <br />
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" required />
            <br />

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required />
            <br />

            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Female</label>
            <br />

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
            <br />

            <label for="confirmPassword">Confirm Password:</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
            <br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <br />

            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" rows="4" required></textarea>
            <br />

            <label for="imageUpload">Upload Image:</label>
            <input
              type="file"
              id="imageUpload"
              name="imageUpload"
              accept="image/*"
            />

            <br />
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>

- gender
- password
- confirm password
- email
- bio (text area)
- طبعا كل ده هيبقا جوا form
- upload image (bouns)
- 
٢- about page
- image
- full name (ex: Ahmed Anwer) => h1
- title (ex: Software Engineer) => h2
- summary (using lorem ipsum) => p

٣- navbar in both pages using anchor (a) to navigate throw 2 pages

٥- هتستخدم ال ai في ال styling هتعمل فايل اسمه style.css وتربطه بال html وتطلب من ال ai يعملك styling وحددله الشكل اللي انت عايزه وعايزك تقرأ الكود وتحاول تفهمه + اتاكد ان ال ai عملك الصفحات كلها responsive -->
